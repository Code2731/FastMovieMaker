[project]
name = "FastMovieMaker"
version = "0.10.0"
description = "Whisper-based automatic subtitle video editor"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "faster-whisper>=1.0.0",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "edge-tts>=7.2.0",
    "imageio-ffmpeg>=0.5.1",
    "zvec",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "apv_smoke: marks APV sample-based smoke tests (requires FMM_APV_SAMPLE)",
]
# MS Store Python(WindowsApps)은 심볼릭링크 resolve() 시 WinError 448이 발생해
# pytest cleanup이 크래시됨. 임시 디렉토리를 보존하지 않으면 cleanup을 건너뜀.
tmp_path_retention_policy = "none"

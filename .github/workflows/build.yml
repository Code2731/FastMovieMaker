name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller FastMovieMaker.spec --noconfirm --clean

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/FastMovieMaker -DestinationPath dist/FastMovieMaker-windows-x64.zip
        shell: pwsh

      - name: Zip artifact (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r FastMovieMaker-macos.zip FastMovieMaker.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastMovieMaker-${{ runner.os }}
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FastMovieMaker-windows-x64.zip
            dist/FastMovieMaker-macos.zip
